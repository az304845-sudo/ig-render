<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#111;overflow:hidden}</style></head>
<body>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
r.setSize(W, H); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x202830);
const c = new THREE.PerspectiveCamera(40, W/H, 0.1, 100); c.position.set(0, 0, 8);
const m = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color:0xb04030}));
s.add(m); s.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.2));
const d = new THREE.DirectionalLight(0xffffff, 1.5); d.position.set(3,4,5); s.add(d);
const fps = Number(new URLSearchParams(location.search).get('fps') || 30);
window.setFrame = (n) => { const t = n / fps; m.rotation.set(t*0.9, t*1.3, 0); r.render(s, c); };
window.setFrame(0);
</script>
</body></html>
