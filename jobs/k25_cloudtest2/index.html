<script type="module">
// k25「舟」：千本鳥居 → 雪の温泉街 → 紅葉の渓谷 → 朝霧の湖 → 上からの全景。
// 外から 3D モデル・画像は読まない。模様は全部ここで計算して作る。
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1080, H = 1920;
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const camera = new THREE.PerspectiveCamera(70, W / H, 0.05, 900);
const FOCAL = H / 2 / Math.tan(THREE.MathUtils.degToRad(35));
const D2R = THREE.MathUtils.degToRad;

// ---------- 乱数・雑音（毎回同じ結果） ----------
let seed = 20251125;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, k) => a + (b - a) * k;
function hash2(i, j) { let h = Math.imul(i, 374761393) + Math.imul(j, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) { const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j; const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash2(i, j), b = hash2(i + 1, j), c = hash2(i, j + 1), d = hash2(i + 1, j + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y) { let s = 0, a = .5, f = 1; for (let k = 0; k < 5; k++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= .5; } return s / .97; }
const ease = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };

// ---------- 計算で作る模様（キャンバスに描く） ----------
function noiseCanvas(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h, c);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}
const vermilionTex = noiseCanvas(256, 1024, (g, w, h) => {
  g.fillStyle = '#c9542a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) { const x = rnd() * w, y = rnd() * h, r = rr(2, 14);
    g.fillStyle = `rgba(${rnd() < .5 ? '150,30,12' : '214,72,34'},${rr(.05, .18)})`; g.beginPath(); g.ellipse(x, y, r, r * rr(1, 3), 0, 0, 7); g.fill(); }
  for (let i = 0; i < 90; i++) { const x = rnd() * w, y0 = rnd() * h * .7, len = rr(40, 300);
    const gr = g.createLinearGradient(0, y0, 0, y0 + len);
    gr.addColorStop(0, 'rgba(60,20,10,0)'); gr.addColorStop(.5, `rgba(70,22,12,${rr(.08, .22)})`); gr.addColorStop(1, 'rgba(60,20,10,0)');
    g.fillStyle = gr; g.fillRect(x, y0, rr(1, 4), len); }
  const gb = g.createLinearGradient(0, h * .62, 0, h); gb.addColorStop(0, 'rgba(40,25,15,0)'); gb.addColorStop(1, 'rgba(40,25,15,.45)');
  g.fillStyle = gb; g.fillRect(0, h * .62, w, h * .38);
  for (let i = 0; i < 60; i++) { g.fillStyle = `rgba(120,85,55,${rr(.25, .6)})`; g.fillRect(rnd() * w, rnd() * h, rr(2, 8), rr(1, 5)); }
});
const blackTex = noiseCanvas(256, 256, (g, w, h) => {
  g.fillStyle = '#141210'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1500; i++) { g.fillStyle = `rgba(${rnd() < .5 ? '40,36,32' : '5,5,5'},${rr(.1, .3)})`; g.fillRect(rnd() * w, rnd() * h, rr(1, 6), rr(1, 6)); }
});
const stoneTex = noiseCanvas(512, 512, (g, w, h) => {
  g.fillStyle = '#5f5a52'; g.fillRect(0, 0, w, h);
  const n = 8;
  for (let j = 0; j < n; j++) for (let i = 0; i < n / 2; i++) { const off = (j % 2) * (w / n); const x = i * w / (n / 2) + off, y = j * h / n; const v = rr(-18, 18);
    g.fillStyle = `rgb(${95 + v},${90 + v},${82 + v})`; g.fillRect(x + 3, y + 3, w / (n / 2) - 6, h / n - 6); }
  for (let i = 0; i < 5000; i++) { g.fillStyle = `rgba(${rnd() < .5 ? '30,32,25' : '140,135,120'},${rr(.05, .2)})`; g.fillRect(rnd() * w, rnd() * h, rr(1, 4), rr(1, 4)); }
  for (let i = 0; i < 120; i++) { g.fillStyle = `rgba(55,75,40,${rr(.15, .35)})`; g.beginPath(); g.arc(rnd() * w, rnd() * h, rr(3, 16), 0, 7); g.fill(); }
});
stoneTex.repeat.set(1, 30);
// 石の地肌（ざらつき・欠け・筋）
const rockTex = noiseCanvas(512, 512, (g, w, h) => {
  g.fillStyle = '#8a857c'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { const l = rr(70, 190) | 0; g.fillStyle = `rgba(${l},${l - 4},${l - 10},${rr(.08, .3)})`; g.fillRect(rnd() * w, rnd() * h, rr(1, 5), rr(1, 5)); }
  for (let i = 0; i < 260; i++) { g.strokeStyle = `rgba(40,36,32,${rr(.1, .35)})`; g.lineWidth = rr(.6, 1.8); g.beginPath(); let x = rnd() * w, y = rnd() * h; g.moveTo(x, y);
    for (let k = 0; k < 5; k++) { x += rr(-30, 30); y += rr(-30, 30); g.lineTo(x, y); } g.stroke(); }
  for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(${rnd() < .5 ? '60,58,52' : '170,165,155'},${rr(.1, .3)})`; g.beginPath(); g.arc(rnd() * w, rnd() * h, rr(3, 14), 0, 7); g.fill(); }
});
const snowTex = noiseCanvas(512, 512, (g, w, h) => {
  g.fillStyle = '#f2f4f8'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) { const l = rr(200, 250) | 0; g.fillStyle = `rgba(${l - 6},${l - 2},${l},${rr(.1, .4)})`; g.beginPath(); g.arc(rnd() * w, rnd() * h, rr(1, 6), 0, 7); g.fill(); }
  for (let i = 0; i < 200; i++) { g.fillStyle = `rgba(170,180,200,${rr(.05, .15)})`; g.beginPath(); g.ellipse(rnd() * w, rnd() * h, rr(8, 30), rr(4, 12), rnd() * 3, 0, 7); g.fill(); }
});
// 葉のかたまり（色は1本ずつ掛ける）
const leafTex = noiseCanvas(512, 512, (g, w, h) => {
  g.fillStyle = '#b8b8b8'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 12000; i++) { const l = rr(110, 255) | 0; g.fillStyle = `rgba(${l},${l},${l},${rr(.45, .95)})`; g.beginPath(); g.ellipse(rnd() * w, rnd() * h, rr(2, 6), rr(1, 3.5), rnd() * 3, 0, 7); g.fill(); }
  for (let i = 0; i < 1800; i++) { g.fillStyle = `rgba(25,25,25,${rr(.3, .75)})`; g.beginPath(); g.arc(rnd() * w, rnd() * h, rr(1.5, 5), 0, 7); g.fill(); }
});
const woodTex = noiseCanvas(512, 128, (g, w, h) => {
  g.fillStyle = '#4a3122'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 1) { const v = Math.sin(y * .35 + Math.sin(y * .05) * 4) * 10 + rr(-6, 6);
    g.fillStyle = `rgba(${74 + v},${50 + v * .7},${34 + v * .5},.55)`; g.fillRect(0, y, w, 1); }
  for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(20,12,8,${rr(.1, .3)})`; g.fillRect(rnd() * w, rnd() * h, rr(20, 120), 1); }
  for (let i = 0; i < 6; i++) { g.strokeStyle = 'rgba(25,15,10,.5)'; g.lineWidth = 1.2; g.beginPath(); g.ellipse(rnd() * w, rnd() * h, rr(6, 14), rr(2, 4), 0, 0, 7); g.stroke(); }
});
const plankTex = noiseCanvas(1024, 256, (g, w, h) => {
  g.drawImage(woodTex.image, 0, 0, w, h);
  for (let k = 1; k < 4; k++) { const y = k * h / 4 + rr(-3, 3); g.fillStyle = 'rgba(18,10,6,.85)'; g.fillRect(0, y, w, 2); g.fillStyle = 'rgba(150,120,90,.25)'; g.fillRect(0, y + 2, w, 1); }
  for (let i = 0; i < 40; i++) { g.fillStyle = 'rgba(30,25,22,.8)'; g.beginPath(); g.arc(rnd() * w, (Math.floor(rnd() * 4) + .5) * h / 4, 2, 0, 7); g.fill(); }
  for (let i = 0; i < 30; i++) { g.fillStyle = `rgba(200,180,150,${rr(.05, .15)})`; g.fillRect(rnd() * w, rnd() * h, rr(20, 90), rr(1, 3)); }
});

// 水ぎわより下を濡れた暗い色にする（世界の高さで判定）
function wetify(mat, wetY = -0.05, dark = .45) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.wetY = { value: wetY };
    sh.vertexShader = 'varying float vWY;\n' + sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      { vec4 wq = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
        wq = instanceMatrix * wq;
        #endif
        wq = modelMatrix * wq; vWY = wq.y; }`);
    sh.fragmentShader = 'varying float vWY;\nuniform float wetY;\n' + sh.fragmentShader.replace('#include <map_fragment>', `#include <map_fragment>
      diffuseColor.rgb *= mix(${dark.toFixed(3)}, 1.0, smoothstep(wetY, wetY + 0.22, vWY));`);
  };
  mat.customProgramCacheKey = () => 'wet' + wetY + '_' + dark;
  return mat;
}

// ---------- 材質 ----------
const mVerm = new THREE.MeshStandardMaterial({ map: vermilionTex, roughness: .62, metalness: 0 });
const mBlack = new THREE.MeshStandardMaterial({ map: blackTex, roughness: .5 });
const mStone = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: .9 });
const mWood = new THREE.MeshStandardMaterial({ map: woodTex, roughness: .55, color: 0x9a8a80 });
const mWoodWet = new THREE.MeshStandardMaterial({ map: woodTex, roughness: .3, color: 0x6a5a50 });
const mSnow = new THREE.MeshStandardMaterial({ map: snowTex, roughness: .92, color: 0xffffff });
const leafFine = leafTex.clone(); leafFine.repeat.set(6, 6); leafFine.needsUpdate = true;
const mLeaf = new THREE.MeshStandardMaterial({ map: leafFine, roughness: .9 });

// ---------- 石を積んだ列（1つずつ大きさ・色・苔を変える） ----------
function stoneBlocks({ sx, xFace, depth = .5, yBot, yTop, rowH = .45, z0, z1, mossP = .25, tintLo = .72, tintHi = 1.08 }) {
  const geos = [];
  for (let y = yBot; y < yTop - .02; y += rowH) {
    const hh = Math.min(rowH, yTop - y);
    let z = z0 - rr(0, .4);
    while (z > z1) {
      const len = rr(.45, 1.0), gap = rr(.012, .03);
      const g = new THREE.BoxGeometry(depth, hh - gap, len - gap, 2, 4, 3);
      const ps = g.attributes.position;
      for (let j = 0; j < ps.count; j++) ps.setXYZ(j, ps.getX(j) + rr(-.012, .012), ps.getY(j) + (ps.getY(j) > 0 ? rr(-.02, .006) : 0), ps.getZ(j) + rr(-.01, .01));
      g.translate(sx * (xFace + depth / 2) + rr(-.015, .015), y + hh / 2, z - len / 2);
      g.computeVertexNormals();
      const tint = rr(tintLo, tintHi), warm = rr(-.05, .05), moss = rnd() < mossP, mz = rnd() * 50;
      const col = [];
      for (let j = 0; j < ps.count; j++) {
        const wy = ps.getY(j);
        let r = tint * (1 + warm), gg = tint, b = tint * (1 - warm);
        if (moss) { const m = sm(.3, -.02, wy) * (.35 + .65 * vnoise(ps.getZ(j) * 6 + mz, wy * 7)); r = lerp(r, .42, m * .85); gg = lerp(gg, .55, m * .85); b = lerp(b, .28, m * .85); }
        col.push(r, gg, b);
      }
      g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      geos.push(g); z -= len;
    }
  }
  return mergeGeometries(geos);
}
const mBlocks = wetify(new THREE.MeshStandardMaterial({ map: rockTex, vertexColors: true, roughness: .88, color: 0x8c877e }), -0.04, .42);

// ---------- 鳥居の形（大きさを変えられる） ----------
function makeGate(HW = 1.22, GH = 3.05, pr = .115, under = 0) {
  const k = GH / 3.05;
  const parts = { verm: [], black: [] };
  for (const sx of [-1, 1]) {
    const pl = GH - .35 * k + under;
    const p = new THREE.CylinderGeometry(pr * .96, pr, pl, 18, 1); p.translate(sx * HW, pl / 2 + .35 * k - under, 0); parts.verm.push(p);
    const b = new THREE.CylinderGeometry(pr * 1.12, pr * 1.18, .36 * k + under, 18, 1); b.translate(sx * HW, (.36 * k + under) / 2 - under, 0); parts.black.push(b);
  }
  const nuki = new THREE.BoxGeometry(HW * 2 + .5 * k, .13 * k, .1 * k); nuki.translate(0, GH - .62 * k, 0); parts.verm.push(nuki);
  const kus = new THREE.BoxGeometry(.12 * k, .22 * k, .11 * k); kus.translate(0, GH - .42 * k, 0); parts.verm.push(kus);
  const shim = new THREE.BoxGeometry(HW * 2 + .62 * k, .14 * k, .16 * k); shim.translate(0, GH - .2 * k, 0); parts.verm.push(shim);
  const kg = new THREE.BoxGeometry(HW * 2 + .9 * k, .14 * k, .2 * k, 24, 1, 1);
  const pos = kg.attributes.position;
  for (let i = 0; i < pos.count; i++) { const x = pos.getX(i); const q = Math.abs(x) / (HW + .45 * k); pos.setY(i, pos.getY(i) + .09 * k * q * q * q); }
  kg.computeVertexNormals(); kg.translate(0, GH - .05 * k, 0); parts.black.push(kg);
  return { verm: mergeGeometries(parts.verm), black: mergeGeometries(parts.black) };
}

// ---------- 木のかたまり・針葉樹・岩の形 ----------
function blobGeo(seedOff = 0) {
  const g = new THREE.IcosahedronGeometry(1, 5); const p = g.attributes.position; const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i);
    const n = vnoise(v.x * 2.3 + seedOff, v.y * 2.3 + v.z * 1.7) * .32 + vnoise(v.x * 6 + v.z * 3 + seedOff, v.y * 6) * .16 + vnoise(v.x * 15 + v.z * 9 + seedOff, v.y * 15 - v.z * 4) * .09;
    v.multiplyScalar(.82 + n); if (v.y < -.3) v.y = -.3 + (v.y + .3) * .4; p.setXYZ(i, v.x, v.y, v.z); }
  g.deleteAttribute('normal'); const m = mergeVertices(g, 1e-4); m.computeVertexNormals(); return m;
}
function coniferGeo() {
  const gs = [];
  const layers = [[1, 1.5, .55], [.8, 1.3, 1.25], [.58, 1.1, 1.9], [.36, .9, 2.45]];
  for (const [r, h, y] of layers) { const c = new THREE.ConeGeometry(r, h, 12, 2, true); const p = c.attributes.position;
    for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i); const a = Math.atan2(z, x); const s = 1 + .12 * Math.sin(a * 7 + y * 5); if (p.getY(i) < 0) { p.setX(i, x * s); p.setZ(i, z * s); } }
    c.translate(0, y, 0); gs.push(c); }
  const g = mergeGeometries(gs); g.computeVertexNormals(); return g;
}
function rockGeo(s) {
  const g = new THREE.IcosahedronGeometry(1, 4); const p = g.attributes.position; const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i);
    const n = (fbm(v.x * 1.1 + s, v.y * 1.1 + v.z * .9 + s) - .5) * .55 + (vnoise(v.x * 5 + s, v.y * 5 + v.z * 4) - .5) * .12;
    v.multiplyScalar(1 + n); if (v.y < -.35) v.y = -.35 + (v.y + .35) * .3; p.setXYZ(i, v.x, v.y * .75, v.z); }
  g.deleteAttribute('normal'); const m = mergeVertices(g, 1e-4); m.computeVertexNormals(); return m;
}

// ---------- 水：鏡＋波＋舳先の V 字の波＋（渓谷は）白い泡 ----------
function makeWater({ w, l, cx = 0, cz, fogColor, den, deep, distort = .0085, waveAmp = 1, flow = 0, foamAmt = 0, foamZ = [-1e4, 1e4], rocks = [], bow = true, fres0 = .18, reflK = 1, streakK = .7, dapple = 0, glint = null, wakeK = 1, wakeA = .62, tw = 1080, th = 1920 }) {
  const rk = []; for (let i = 0; i < 24; i++) rk.push(rocks[i] ? new THREE.Vector4(rocks[i][0], rocks[i][1], rocks[i][2], 0) : new THREE.Vector4());
  const shader = {
    name: 'k25Water',
    uniforms: { color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null }, time: { value: 0 },
      fogColor: { value: new THREE.Color(fogColor) }, fogDen: { value: den }, deep: { value: new THREE.Color(deep) },
      distort: { value: distort }, waveAmp: { value: waveAmp }, flow: { value: flow }, foamAmt: { value: foamAmt }, foamZ: { value: new THREE.Vector2(...foamZ) },
      rocks: { value: rk }, nRocks: { value: Math.min(24, rocks.length) }, bow: { value: new THREE.Vector3(0, 0, bow ? 1 : 0) }, fres0: { value: fres0 }, reflK: { value: reflK }, streakK: { value: streakK }, dapple: { value: dapple }, glint: { value: glint || new THREE.Vector4(0, 1, 0, 0) }, wakeK: { value: wakeK }, wakeA: { value: wakeA } },
    vertexShader: `
      uniform mat4 textureMatrix; varying vec4 vUv; varying vec3 vW;
      void main(){ vUv = textureMatrix * vec4(position,1.0); vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `
      uniform vec3 color; uniform sampler2D tDiffuse; uniform float time; uniform vec3 fogColor; uniform float fogDen; uniform vec3 deep;
      uniform float distort; uniform float waveAmp; uniform float flow; uniform float foamAmt; uniform vec2 foamZ; uniform vec4 rocks[24]; uniform int nRocks; uniform float streakK; uniform float dapple; uniform vec4 glint; uniform float wakeK; uniform float wakeA;
      uniform vec3 bow; uniform float fres0; uniform float reflK;
      varying vec4 vUv; varying vec3 vW;
      float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
      float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
        return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
      vec2 nGrad(vec2 p){ float e=0.05; return vec2(vn(p+vec2(e,0))-vn(p-vec2(e,0)), vn(p+vec2(0,e))-vn(p-vec2(0,e)))/(2.0*e); }
      vec2 waveGrad(vec2 p){
        p.y += time*flow;
        vec2 g = vec2(0.0);
        float amp = 0.55 + 0.9 * vn(p*0.45 + vec2(time*0.05, 0.0));
        g += nGrad(p*0.9 + vec2(time*0.12, -time*0.08)) * 0.45;
        g += nGrad(p*2.3 + vec2(time*0.35, time*0.21)) * 0.35 * amp;
        g += nGrad(p*5.1 + vec2(-time*0.6, time*0.4)) * 0.18;
        g += nGrad(p*11.0 + vec2(time*0.9, -time*0.7)) * 0.08;
        g += nGrad(p*vec2(3.2, 9.0) + vec2(time*0.3, time*0.9)) * vec2(0.34, 0.10) * amp;   // 横に細かいさざ波（映り込みの縦じまを崩す）
        return g;
      }
      void main(){
        vec2 g = waveGrad(vW.xz) * waveAmp;
        float white = 0.0;
        if (bow.z > 0.5) {
          vec2 q = vW.xz - bow.xy; float back = q.y;
          float armX = 0.10 + max(back, 0.0) * wakeA;
          float dx = abs(q.x) - armX;
          float fade = exp(-max(back, 0.0) * 0.22) * smoothstep(-0.25, 0.05, back);
          float sw = 0.0005 + max(back, 0.0) * 0.0009;
          float arm = (exp(-dx*dx / sw) + 0.45 * exp(-(dx+0.16)*(dx+0.16) / sw) + 0.25 * exp(-(dx+0.34)*(dx+0.34) / sw)) * fade;
          float inside = smoothstep(0.35, -0.05, dx) * fade;

const out = document.getElementById('out'); out.width = W; out.height = H;

window.setFrame = (n) => window.renderAt((n + 555) / 30);
